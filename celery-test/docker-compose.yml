services:
  redis:
    image: redis:latest
    container_name: celery_redis
    ports:
      - "6379:6379"

  worker:
    image: python:3.11-slim
    container_name: celery_worker
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis
    command: >
      sh -c "pip install -r requirements.txt &&
             celery -A tasks worker --loglevel=info"
    depends_on:
      - redis