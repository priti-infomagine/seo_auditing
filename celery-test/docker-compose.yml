services:
  redis:
    image: redis:latest
    container_name: celery_redis
    ports:
      - "6379:6379"

  worker:
    image: python:3.11-slim
    container_name: celery_worker
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis
    command: >
      sh -c "pip install -r requirements.txt &&
             celery -A tasks worker --loglevel=info"
    depends_on:
      - redis

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: priti123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"