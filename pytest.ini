[pytest]
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
# Discover test functions in files that do not follow the test_*.py convention
# (the crawler/tests/ folder uses descriptive names like document.py, metadata.py, etc.)
python_files = *.py
markers =
    celery: opt-in tests that hit the real Celery/Redis broker (see test_register_latency.py)

